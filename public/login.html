<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Proyecto Full Stack</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>Iniciar Sesión</h1>

            <p class="subtitulo">
                Acceso a la aplicación Full Stack
            </p>

            <form id="loginForm">

                <div class="campo">
                    <label for="usuario">Usuario</label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Ingrese su usuario"
                        required>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingrese su contraseña"
                        required>
                </div>

                <button type="submit">
                    Iniciar Sesión
                </button>

            </form>

            <p id="mensaje"></p>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
